name: JSP-000622 proof environment
on:
  push:
    branches: [work/jsp-000622-z20-lean]
    paths: [.github/workflows/jsp-000622-bootstrap.yml]
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Prepare pinned toolchain and source evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jsp-env /tmp/exports
          cd /tmp/jsp-env
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0/lean-4.33.0-linux.tar.zst -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst
          export PATH="/tmp/jsp-env/lean-4.33.0-linux/bin:$PATH"
          lean --version | tee /tmp/exports/lean-version.txt
          sha256sum /tmp/lean.tar.zst > /tmp/exports/toolchain.sha256
          split -b 400M -d /tmp/lean.tar.zst /tmp/exports/toolchain.part
          git clone --depth 1 --branch v4.33.0 https://github.com/leanprover-community/mathlib4.git mathlib
          cd mathlib
          lake exe cache get
          git rev-parse HEAD > /tmp/exports/mathlib-commit.txt
          cd ..
          git clone https://github.com/ipitchford/z20-cochromatic.git upstream-z20
          git -C upstream-z20 checkout 8dc4b8cd31f4323d6a032752f4cfd69c06d5ca90
          git clone --depth 1 https://github.com/leansolving/lrat-catcher.git lrat-catcher
          git -C lrat-catcher rev-parse HEAD > /tmp/exports/lrat-catcher-commit.txt
          git clone --filter=blob:none --no-checkout https://github.com/plby/lean-proofs.git existing-proofs
          git -C existing-proofs sparse-checkout init --cone
          git -C existing-proofs sparse-checkout set src/latest/ErdosProblems/Erdos758
          git -C existing-proofs checkout 8822f7ddef30fadbd92e1c6ab4ed897af356af5e
          tar --exclude=.git --exclude=mathlib/.lake/packages/*/.git --exclude=existing-proofs/src/lean --use-compress-program='zstd -T2 -3' -cf /tmp/evidence.tar.zst upstream-z20 lrat-catcher existing-proofs
          split -b 400M -d /tmp/evidence.tar.zst /tmp/exports/evidence.part
          tar --exclude=.git --use-compress-program='zstd -T2 -3' -cf /tmp/mathlib.tar.zst mathlib
          split -b 400M -d /tmp/mathlib.tar.zst /tmp/exports/mathlib.part
          cd /tmp/exports
          sha256sum *.part* > SHA256SUMS
          du -h *
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsp622-environment-metadata
          path: |
            /tmp/exports/*.txt
            /tmp/exports/*.sha256
            /tmp/exports/SHA256SUMS
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jsp622-toolchain-00
          path: /tmp/exports/toolchain.part00
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jsp622-toolchain-01
          path: /tmp/exports/toolchain.part01
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jsp622-evidence-00
          path: /tmp/exports/evidence.part00
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jsp622-evidence-01
          path: /tmp/exports/evidence.part01
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jsp622-mathlib-00
          path: /tmp/exports/mathlib.part00
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jsp622-mathlib-01
          path: /tmp/exports/mathlib.part01
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jsp622-mathlib-02
          path: /tmp/exports/mathlib.part02
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jsp622-mathlib-03
          path: /tmp/exports/mathlib.part03
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jsp622-mathlib-04
          path: /tmp/exports/mathlib.part04
          compression-level: 0
          retention-days: 7
