name: JSP404 runtime preparation only
on:
  push:
    branches: [research/jsp404-runtime-only-20260918]
    paths: [.github/workflows/jsp404-runtime-only.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jsp404-runtime-only
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Fetch official fixed compiler and run positive and negative smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer runtime work
          curl --fail --location --retry 3 --max-time 300 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            -o transfer/lean-4.19.0-linux.tar.zst
          test "$(stat -c %s transfer/lean-4.19.0-linux.tar.zst)" = 343842845
          sha256sum transfer/lean-4.19.0-linux.tar.zst | tee transfer/SHA256SUMS
          tar --zstd -xf transfer/lean-4.19.0-linux.tar.zst --strip-components=1 -C runtime
          LEAN="$PWD/runtime/bin/lean"
          "$LEAN" --version | tee transfer/version.txt
          "$LEAN" --githash | tee transfer/githash.txt
          test "$(cat transfer/githash.txt)" = 6caaee842e9495688c1567e78c0e68dbb96942aa
          printf 'import Lean\ntheorem smoke (a b : Int) (h : a < b) : a + 1 <= b := by omega\n#print axioms smoke\n' > work/Smoke.lean
          "$LEAN" --trust=0 work/Smoke.lean > transfer/positive.log 2>&1
          ! grep -q sorryAx transfer/positive.log
          printf 'import Lean\nexample : (1 : Nat) = 0 := by decide\n' > work/Negative.lean
          if "$LEAN" --trust=0 work/Negative.lean > transfer/negative.log 2>&1; then
            echo 'Invalid theorem unexpectedly accepted'; exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib, hashlib
          p=pathlib.Path('transfer/lean-4.19.0-linux.tar.zst')
          h=hashlib.sha256()
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1048576),b''): h.update(b)
          pathlib.Path('transfer/receipt.json').write_text(json.dumps({
              'scope':'Compiler preparation and smoke tests ONLY; no mathematical problem proved.',
              'lean_version':'4.19.0', 'lean_commit':'6caaee842e9495688c1567e78c0e68dbb96942aa',
              'archive_sha256':h.hexdigest(), 'archive_bytes':p.stat().st_size,
              'positive_smoke_pass':True, 'negative_smoke_rejected':True,
              'jsp000404_complete':False, 'jsp000404_kernel_verified':False,
              'repository':os.environ['GITHUB_REPOSITORY'], 'commit':os.environ['GITHUB_SHA'],
              'run_id':os.environ['GITHUB_RUN_ID']}, indent=2)+'\n')
          PY
      - name: Export compiler, checksums and smoke-test receipt only
        uses: actions/upload-artifact@v4
        with:
          name: jsp404-lean419-runtime-only
          path: transfer/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
